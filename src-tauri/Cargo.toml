[package]
name = "nexmusic"
version = "0.1.0"
description = "NexMusic - 网易云 / 酷狗 / QQ 音乐播放器"
authors = ["NexMusic"]
license = "GPL-3.0"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "nexmusic_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = { version = "1.0", features = ["preserve_order"] }
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
reqwest = { version = "0.11", features = ["stream", "json"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
dirs = "5.0"
regex = "1"
rand = "0.8"
urlencoding = "2.1"
url = "2"
base64 = "0.22"
axum = "0.7"
chrono = "0.4"
md-5 = "0.10"
aes = "0.8"
cipher = "0.4"
cbc = { version = "0.1", features = ["block-padding", "alloc"] }
num-bigint = "0.4"
num-traits = "0.2"
hex = "0.4"
sha1 = "0.10"
encoding_rs = "0.8"
